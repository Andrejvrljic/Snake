<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1720">
  <title>Snake</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hud">
      <h1>Snake</h1>
      <div class="scores">
        <div><span class="label">Punkte</span><span id="score">0</span></div>
        <div><span class="label">Rekord</span><span id="best">0</span></div>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="board" aria-label="Spielfeld"></canvas>
      <div id="overlay" class="overlay" role="status" aria-live="polite">
        <p id="overlay-title" class="overlay-title">Snake</p>
        <p id="overlay-text" class="overlay-text"></p>
        <button id="overlay-button" type="button">Start</button>
      </div>
    </div>

    <div class="pad" aria-label="Steuerung">
      <button type="button" data-dir="up" aria-label="Hoch">▲</button>
      <button type="button" data-dir="left" aria-label="Links">◀</button>
      <button type="button" id="pause" aria-label="Pause">❚❚</button>
      <button type="button" data-dir="right" aria-label="Rechts">▶</button>
      <button type="button" data-dir="down" aria-label="Runter">▼</button>
    </div>

    <p class="help">Pfeiltasten oder WASD · Leertaste = Pause · Auf dem Handy: wischen oder Tasten</p>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
